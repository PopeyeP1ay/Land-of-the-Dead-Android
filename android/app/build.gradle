plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.lotd.offline'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.lotd.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        // Large preloaded .data must be streamed, not decompressed into another temp copy.
        noCompress.addAll(['data', 'wasm'])
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}
